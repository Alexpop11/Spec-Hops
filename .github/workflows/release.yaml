name: Build Spec-Hops

on:
  pull_request:
    branches: [master] # Adjust this if your main branch has a different name
  release:
    types: [created]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Single source of truth for the Emscripten version. Pinned to match the
  # WebGPU-distribution snapshot vendored in this project (see the build tree's
  # _deps/webgpu-src/emscripten-git-tag.txt). Newer Emscripten dropped the
  # bundled <webgpu/webgpu.h> that the snapshot's -sUSE_WEBGPU path relies on,
  # in favor of --use-port=emdawnwebgpu. Also feeds the web cache key so a
  # version change invalidates any stale toolchain-configured build dir.
  EMSCRIPTEN_VERSION: "3.1.66"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            output_name: Spec-Hops-linux
          - os: macos-latest
            output_name: Spec-Hops-macos-intel
            arch: x86_64
          - os: macos-latest
            output_name: Spec-Hops-macos-arm
            arch: arm64
          - os: windows-latest
            output_name: Spec-Hops-windows.exe

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Print status of submodules
        run: |
          git submodule update --init --recursive
          git submodule status

      - name: Cache native build
        uses: actions/cache@v6
        with:
          path: build # will be created on first run
          # The -v2 namespace evicts caches configured with the old pinned VS17
          # generator; a restored CMakeCache.txt from a different generator would
          # otherwise conflict with the runner's current default VS generator.
          key: ${{ matrix.output_name }}-build-v2-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/CMakePresets.json') }}
          restore-keys: |
            ${{ matrix.output_name }}-build-v2-

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev xorg-dev libglu1-mesa-dev
          sudo apt-get install libxrandr-dev libxinerama-dev libxcursor-dev mesa-common-dev libx11-xcb-dev pkg-config nodejs npm

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install cmake ninja

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Others)
        if: matrix.os != 'windows-latest'
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release ${{ matrix.os == 'macos-latest' && format('-DCMAKE_OSX_ARCHITECTURES={0}', matrix.arch) || '' }}

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Prepare release package
        if: github.event_name == 'release'
        run: |
          mkdir release
          cp build/OpenGL/${{ matrix.os == 'windows-latest' && 'Release/' || '' }}Spec-Hops${{ matrix.os == 'windows-latest' && '.exe' || '' }} release/${{ matrix.output_name }}
          cp -r OpenGL/res release/res

      - name: Set executable permissions (macOS)
        if: github.event_name == 'release' && matrix.os != 'windows-latest'
        run: |
          chmod +x release/${{ matrix.output_name }}

      - name: Create release archive (Unix)
        if: github.event_name == 'release' && matrix.os != 'windows-latest'
        run: |
          cd release
          zip -r ../${{ matrix.output_name }}.zip .

      - name: Create release archive (Windows)
        if: github.event_name == 'release' && matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path release\* -DestinationPath ${{ matrix.output_name }}.zip

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.output_name }}.zip
          asset_name: ${{ matrix.output_name }}.zip
          tag: ${{ github.ref }}
          overwrite: true

  build-web:
    name: Build for Web and Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - name: Verify Emscripten version
        run: emcc -v

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev xorg-dev libglu1-mesa-dev
          sudo apt-get install libxrandr-dev libxinerama-dev libxcursor-dev mesa-common-dev libx11-xcb-dev pkg-config nodejs npm

      - name: Cache web build
        uses: actions/cache@v6
        with:
          path: build_emscripten
          # Emscripten version is in the key so bumping the toolchain evicts any
          # build dir configured against the previous version's absolute paths.
          key: web-build-emscripten-${{ env.EMSCRIPTEN_VERSION }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/CMakePresets.json') }}
          restore-keys: |
            web-build-emscripten-${{ env.EMSCRIPTEN_VERSION }}-

      - name: Configure and Build with Emscripten
        run: |
          emcmake cmake -S . -B build_emscripten -DCMAKE_BUILD_TYPE=Release
          emmake make -C build_emscripten

      - name: Prepare Web Build
        run: |
          mkdir web_build
          cp build_emscripten/OpenGL/Spec-Hops.data web_build/
          cp build_emscripten/OpenGL/Spec-Hops.js web_build/
          cp build_emscripten/OpenGL/Spec-Hops.wasm web_build/
          cp -r build_emscripten/OpenGL/static web_build/
          cp build_emscripten/OpenGL/Spec-Hops.html web_build/index.html

      - name: Setup Pages
        if: github.event_name == 'release'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name == 'release'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./web_build"

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'release'
        uses: actions/deploy-pages@v5
